# CI för Svada-mini. Kör det som går utan att starta hela stacken (den kräver Docker med ungefär 12 GiB minne och tar flera minuter att starta):
# skalsyntax, enhetsprov, dokument/kod-synk, compose-filerna och en hemlighetsskanning. Hela kedjan provas med tests/verify_all.sh lokalt.
# CI runs what works without starting the full stack: shell syntax, unit tests, docs/code sync, compose files and a secret scan.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  statiskt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.15"
      - name: Beroenden för enhetsproven
        run: |
          set -a; . ./.env.exempel; set +a
          pip install "fastapi==${FASTAPI_VERSION}" "uvicorn==${UVICORN_VERSION}"
      - name: Skalsyntax
        run: for f in $(git ls-files '*.sh'); do bash -n "$f" || exit 1; done
      - name: Python kompilerar
        run: python -m compileall -q services tests tools
      - name: Compose-filerna är giltiga
        run: |
          cp .env.exempel .env
          docker compose --env-file .env -f compose.dhi.yml -f compose.dsga.yml -f compose.stad.yml -f compose.kontrollrum.yml config -q
      - name: Enhetsprov
        run: |
          set -a; . ./.env.exempel; set +a
          for t in statistik_enhet version_enhet portforskjutning_enhet avtal_enhet skydd_enhet ngsild_enhet fcf_csv_enhet engelska_enhet sessioner_enhet aterstall_enhet; do
            echo "== $t"; python tests/$t.py
          done
      - name: Dokument och kod hänger ihop
        run: bash tests/verify_docs.sh
  hemligheter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo -c /repo/.gitleaks.toml --redact
