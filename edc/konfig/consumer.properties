# =====================================================================
# edc-consumer – Göteborgs Stads kontrollplan (komponent 7)
# =====================================================================
# Identisk uppsättning som provider.properties, men med stadens
# deltagar-ID och portserien 29191-29194 (portkartan i .env).
# Samma image, olika konfig – rollen ligger enbart här.
#
# Consumern registrerar INGA assets och äger INGA policyer: den hämtar
# katalog, förhandlar och tar emot. Att KoV-godkännandet för Distribution
# A inte går att påverka härifrån är hela poängen med hård regel 7.
#
# KONCEPT: docs/koncept/C5-skalning.md
# "Samma image, olika konfig" är operatörsmönstret som skalar: en delad
# driftorganisation eller dataförmedlingstjänst kan köra många deltagares
# connectorer utan att röra deras mandat. Se C5, Svar 1 punkt 4.
# =====================================================================

# --- Identitet i dataspacet (verifierbar DCP-identitet) ------
# Se provider.properties för hela motiveringen till varje rad nedan -
# identisk mekanik, bara Stadens egna värden.
# MÅSTE vara den här connectorns EGEN DID (matchar .env:s
# SVADA_PARTICIPANT_DID_STAD/EDC_CONSUMER_ID).
edc.participant.id=did:web:identity-hub-stad%3A29197

edc.iam.did.web.use.https=false

edc.iam.sts.oauth.token.url=http://identity-hub-stad:29199/api/sts/token
edc.iam.sts.oauth.client.id=did:web:identity-hub-stad%3A29197
edc.iam.sts.oauth.client.secret.alias=svada-sts-client-secret

# Inkommande (motpartens VP-verifiering). Utfärdare med rätt mandat: varje intygstyp godtas BARA
# från rätt utfärdare (edc.iam.trustedissuer.<alias>.supportedtypes, se
# provider.properties). Consumern verifierar DHI:s presentation:
#   - medlems- och deltagarintyg: bara från Svadas utfärdare (DSGA 0.1)
#   - rollintyg: bara från DHI självt (DHI intygar sin egen roll)
# DHI är INTE betrodd för medlemsintyg och utfärdar inga intyg åt andra.
# Stadens egen DID står inte här: consumern verifierar aldrig stadens eget intyg.
edc.iam.trustedissuer.svada.id=did:web:identity-hub-svada%3A49197
edc.iam.trustedissuer.svada.supportedtypes=["SvadaParticipantCredential","SvadaMembershipCredential"]
edc.iam.trustedissuer.dhi.id=did:web:identity-hub-dhi%3A19197
edc.iam.trustedissuer.dhi.supportedtypes=["SvadaRoleCredential"]

# Samma tre VC-typer som providern efterfrågar, se provider.properties.
edc.iam.dcp.scopes.deltagare.id=svada-deltagare-scope
edc.iam.dcp.scopes.deltagare.type=DEFAULT
edc.iam.dcp.scopes.deltagare.value=org.eclipse.dspace.dcp.vc.type:SvadaParticipantCredential:read
edc.iam.dcp.scopes.medlemskap.id=svada-medlemskap-scope
edc.iam.dcp.scopes.medlemskap.type=DEFAULT
edc.iam.dcp.scopes.medlemskap.value=org.eclipse.dspace.dcp.vc.type:SvadaMembershipCredential:read
edc.iam.dcp.scopes.roll.id=svada-roll-scope
edc.iam.dcp.scopes.roll.type=DEFAULT
edc.iam.dcp.scopes.roll.value=org.eclipse.dspace.dcp.vc.type:SvadaRoleCredential:read

# --- DSP: protokollet mot andra connectorer (publikt) ----------------
# Värdnamnet connectorn känner sig själv som. Sätts explicit – utan den
# faller EDC tillbaka på 'localhost' och varnar vid uppstart.
edc.hostname=edc-consumer
edc.dsp.callback.address=http://edc-consumer:29194/protocol
web.http.protocol.port=29194
web.http.protocol.path=/protocol

# --- Default/observability-kontexten (health) -----------------------
# GET http://edc-consumer:29191/api/check/health
web.http.port=29191
web.http.path=/api

# --- Management-API (stadens egen administration) -------------------
# Härifrån görs katalogförfrågan mot providern (testfall 4a.2) och
# kontraktsförhandlingen.
#
# Nyckelskyddade management-API:er (docs/koncept/C1-identitet.md): token-baserad autentisering,
# delad nyckel. Nyckelvärdet sätts INTE här utan via miljövariabeln
# WEB_HTTP_MANAGEMENT_AUTH_KEY, som här får CONSUMERNS nyckel (annat
# värde än providerns – se compose.stad.yml/compose.dhi.yml). Anropas med
# headern X-Api-Key. Nyckeln ligger kvar som försvar på djupet vid sidan av den verifierbara DCP-identiteten.
web.http.management.auth.type=tokenbased
web.http.management.port=29193
web.http.management.path=/management

# --- Control-API (internt) ------------------------------------------
web.http.control.port=29192
web.http.control.path=/control

# --- Dataplanets publika kontext (används vid överföring och mottagning) -------------------
web.http.public.port=29291
web.http.public.path=/public
edc.dataplane.api.public.baseurl=http://edc-consumer:29291/public

# --- Nycklar för transfer-tokens -------------------------------------
# Se provider.properties för motiveringen
# (se.goteborg.svada.edc.dcp.SvadaTransferProxyNyckelExtension) - varje
# instans genererar sitt EGET RSA-nyckelpar slumpmässigt vid uppstart.
edc.transfer.proxy.token.signer.privatekey.alias=private-key
edc.transfer.proxy.token.verifier.publickey.alias=public-key

# Återkallelse av intyg (StatusListController hos Svadas utfärdare): hur länge en hämtad statuslista
# återanvänds. EDC:s standard är 15 minuter; i demon 2 sekunder, så att en återkallelse slår igenom direkt.
edc.iam.credential.revocation.cache.validity=2000
edc.iam.credential.revocation.mimetype=application/vc+jwt
