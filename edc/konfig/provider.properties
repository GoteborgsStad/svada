# =====================================================================
# edc-provider – DHI:s kontrollplan (komponent 6)
# =====================================================================
# KONCEPT: docs/koncept/C4-connector.md
# De fyra web.http.*-kontexterna nedan ÄR connectorns fyra API-ytor
# (management, DSP/protocol, control, observability) plus dataplanet.
# Monteras in i containern som /config/connector.properties och läses av
# EDC:s configuration-filesystem-modul (-Dedc.fs.config i Dockerfile:n).
#
# VIKTIGT om värdnamn: alla adresser här är CONTAINERINTERNA
# (edc-provider:19194), inte localhost:19194 som i EDC:s samples. Consumer-
# connectorn slår upp providern över det delade nätet svada-dsp-public,
# och den adress som står i edc.dsp.callback.address är den adress som
# providern skickar med i sina DSP-svar – står localhost där, försöker
# consumern anropa sig själv.
#
# Portarna följer portkartan i .env: 19191-19194.
# =====================================================================

# --- Identitet i dataspacet (verifierbar DCP-identitet) ------
# Deltagar-ID:t är det consumern anger som counterPartyId i sina anrop.
# MÅSTE vara den här connectorns EGEN DID (matchar .env:s
# SVADA_PARTICIPANT_DID_DHI/EDC_PROVIDER_ID) - DidConfigProvider i
# decentralized-claims-core konsulterar ALDRIG edc.participant.did som
# fallback när edc.participant.id redan är satt (till "dhi" fungerade
# det INTE, trots namnet). Värdet
# blir iss/sub i de self-issued STS-tokens den här connectorn hämtar åt
# sig själv för utgående DSP-anrop.
edc.participant.id=did:web:identity-hub-dhi%3A19197

# did:web-upplösning: IdentityHub-instanserna svarar över RENT HTTP
# internt i svada-dsp-public-nätet (ingen TLS-terminering i PoC:en).
# WebDidExtension har EN global flagga, ingen per-värdnamnsscopning.
edc.iam.did.web.use.https=false

# Utgående (denna connector som CALLER mot motpartens DSP-endpoint):
# hämtar ett self-issued token från sin EGEN IdentityHubs inbäddade STS
# (StsRemoteClientExtension, decentralized-claims-sts-remote-client).
# client.id MÅSTE vara samma DID som edc.participant.id ovan
# (StsAccountServiceImpl#createAccount sätter .clientId(manifest.getDid())
# vid participant-skapandet i IdentityHub). client.secret.alias pekar på
# aliaset se.goteborg.svada.edc.dcp.SvadaDcpIdentityExtension seedar i
# den HÄR connectorns egen vault (se compose.dhi.yml, SVADA_STS_CLIENT_SECRET).
edc.iam.sts.oauth.token.url=http://identity-hub-dhi:19199/api/sts/token
edc.iam.sts.oauth.client.id=did:web:identity-hub-dhi%3A19197
edc.iam.sts.oauth.client.secret.alias=svada-sts-client-secret

# Inkommande (motpartens VP-verifiering). Utfärdare med rätt mandat: varje intygstyp godtas BARA
# från rätt utfärdare (EDC 0.17.0: edc.iam.trustedissuer.<alias>.supportedtypes,
# en JSON-lista; HasValidIssuer avvisar ett intyg vars typ inte är registrerad
# för utfärdaren). Providern verifierar STADENS presentation:
#   - medlems- och deltagarintyg: bara från Svadas utfärdare (samordningsrollen,
#     DSGA 0.1, compose.dsga.yml)
#   - rollintyg: bara från staden själv (Kretslopp och Vatten är stadens interna
#     rollfördelning; staden intygar den)
# Staden är INTE betrodd för medlemsintyg. Annars kunde den utfärda giltigt
# medlemskap åt sig själv, samma jäv som utfärdarmodellen ska undvika.
# DHI:s egen DID står inte här: providern verifierar aldrig DHI:s eget intyg.
edc.iam.trustedissuer.svada.id=did:web:identity-hub-svada%3A49197
edc.iam.trustedissuer.svada.supportedtypes=["SvadaParticipantCredential","SvadaMembershipCredential"]
edc.iam.trustedissuer.stad.id=did:web:identity-hub-stad%3A29197
edc.iam.trustedissuer.stad.supportedtypes=["SvadaRoleCredential"]

# Vilka verifierbara claims (VC-typer) den här connectorn efterfrågar i
# motpartens Verifiable Presentation vid en DSP-förhandling
# (DynamicDcpScopeConfigurationExtension). Typnamnen matchar de tre
# attest SvadaParticipantBootstrapExtension myntar (identity-hub/).
edc.iam.dcp.scopes.deltagare.id=svada-deltagare-scope
edc.iam.dcp.scopes.deltagare.type=DEFAULT
edc.iam.dcp.scopes.deltagare.value=org.eclipse.dspace.dcp.vc.type:SvadaParticipantCredential:read
edc.iam.dcp.scopes.medlemskap.id=svada-medlemskap-scope
edc.iam.dcp.scopes.medlemskap.type=DEFAULT
edc.iam.dcp.scopes.medlemskap.value=org.eclipse.dspace.dcp.vc.type:SvadaMembershipCredential:read
edc.iam.dcp.scopes.roll.id=svada-roll-scope
edc.iam.dcp.scopes.roll.type=DEFAULT
edc.iam.dcp.scopes.roll.value=org.eclipse.dspace.dcp.vc.type:SvadaRoleCredential:read

# --- DSP: protokollet mot andra connectorer (publikt) ----------------
# Den adress providern annonserar sig själv med i DSP-meddelanden.
# Värdnamnet connectorn känner sig själv som. Sätts explicit – utan den
# faller EDC tillbaka på 'localhost' och varnar vid uppstart.
edc.hostname=edc-provider
edc.dsp.callback.address=http://edc-provider:19194/protocol
web.http.protocol.port=19194
web.http.protocol.path=/protocol

# --- Default/observability-kontexten (health) -----------------------
# GET http://edc-provider:19191/api/check/health  (modulen api-observability)
web.http.port=19191
web.http.path=/api

# --- Management-API (DHI:s egen administration) ---------------------
# Här registreras assets/policyer/kontraktsdefinitioner, och här kommer
# KoV-godkännandet för Distribution A att hänga på providern (hård regel 7:
# policyverkställighet ägs av PROVIDERN, aldrig av consumern).
#
# Nyckelskyddade management-API:er (docs/koncept/C1-identitet.md): token-baserad autentisering,
# delad nyckel. Nyckelvärdet sätts INTE här utan via miljövariabeln
# WEB_HTTP_MANAGEMENT_AUTH_KEY (EDC:s konfigurationssystem mappar
# miljövariabler till properties-nycklar: punkter -> understreck, versaler)
# – annars låg hemligheten i klartext i en incheckad fil. Anropas med
# headern X-Api-Key. Nyckeln ligger kvar som försvar på djupet; KoV-besluten kräver dessutom verifierbar roll-attest.
web.http.management.auth.type=tokenbased
# Smal, skrivskyddad avtalsstatus för mottagaren (AvtalsstatusController): eget api-sammanhang
# med EGEN nyckel (WEB_HTTP_AVTALSSTATUS_AUTH_KEY), så att staden inte behöver management-nyckeln.
web.http.avtalsstatus.auth.type=tokenbased
web.http.avtalsstatus.port=19195
web.http.avtalsstatus.path=/status
web.http.management.port=19193
web.http.management.path=/management

# --- KoV-gaten (hård regel 7) ---------------------------------
# Slår på SVADA:s ContractNegotiationPendingGuard + endpointsen
#   GET  /management/kov/forhandlingar
#   POST /management/kov/forhandlingar/{id}/godkann
#   POST /management/kov/forhandlingar/{id}/avsla
#   GET  /management/kov/avtal
#   POST /management/kov/avtal/{id}/hav
# Förhandlingar vars ODRL-policy bär obligationen svada:kovGodkannande
# (= Distribution A) pausar i tillståndet REQUESTED tills Data Rights
# Holder (Kretslopp och Vatten) beslutar här.
#
# Flaggan står ENBART i provider.properties. Provider och consumer kör
# samma image; att consumern saknar flaggan är det som gör att den inte
# har någon väg runt gaten (verifieringens testfall 4b.4).
svada.kov.gate.enabled=true

# Namngiven KoV-rollinnehavare, loggad med varje godkänn/avslå-
# beslut (arkitekturinvariant 4, attribuerbarhet). Sätts via miljövariabeln
# SVADA_KOV_ROLLINNEHAVARE, inte hårdkodad – samma part driftar både DHI:s
# och stadens connectorer i PoC:en, men rollnamnet ska ändå vara explicit.

# --- Control-API (internt, connectorns egna komponenter) ------------
web.http.control.port=19192
web.http.control.path=/control

# --- Dataplanets publika kontext (används vid överföring och mottagning) -------------------
# Publiceras INTE mot värden – enbart container-till-container. Därför
# ligger 19291 utanför portkartans 19191-19194 utan att bryta mot den.
web.http.public.port=19291
web.http.public.path=/public
edc.dataplane.api.public.baseurl=http://edc-provider:19291/public

# --- Nycklar för transfer-tokens -------------------------------------
# Aliasen pekar på ett RSA-nyckelpar som
# se.goteborg.svada.edc.dcp.SvadaTransferProxyNyckelExtension genererar
# SLUMPMÄSSIGT VID UPPSTART och lägger i vaulten (se klasskommentaren
# där för hela historiken och motiveringen). Unikt per instans - detta
# är DATAPLANETS egen token-signering, en separat mekanism från
# DSP-lagrets deltagaridentitet ovan, som är verifierbar via DCP.
edc.transfer.proxy.token.signer.privatekey.alias=private-key
edc.transfer.proxy.token.verifier.publickey.alias=public-key

# Återkallelse av intyg (StatusListController hos Svadas utfärdare): hur länge en hämtad statuslista
# återanvänds. EDC:s standard är 15 minuter; i demon 2 sekunder, så att en återkallelse slår igenom direkt.
edc.iam.credential.revocation.cache.validity=2000
edc.iam.credential.revocation.mimetype=application/vc+jwt
