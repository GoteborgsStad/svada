# SVADA PoC – låsta byggversioner för EDC-connectorn (hård regel 4).
# Dockerfile:n skriver över edcVersion med -PedcVersion ur .env, så .env är
# källan; värdet här är fallback om någon bygger utanför Docker.
# (Shadow-pluginets version kan inte styras härifrån – se build.gradle.kts.)
edcVersion=0.17.0

# Byggsteget kör i container utan Gradle-daemon; håll heapen liten så att
# bygget inte konkurrerar med de körande stackarna (resursstrategin, hård regel 3).
org.gradle.jvmargs=-Xmx1g
org.gradle.daemon=false
